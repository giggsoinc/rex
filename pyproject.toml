[project]
name = "rex"
version = "0.1.0"
description = "Multi-agent data cleanup and knowledge management system"
requires-python = ">=3.11"
authors = [{ name = "Giggso", email = "rv@giggso.com" }]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-ai>=0.1",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "prefect>=3.0",

    # Extraction
    "unstructured[all-docs]>=0.16",
    "python-magic>=0.4",

    # ML
    "ollama>=0.4",
    "google-genai>=1.0",
    "pillow>=11.0",

    # Vector stores
    "lancedb>=0.13",
    "pyarrow>=18.0",
    "pgvector>=0.3",

    # MCP
    "fastmcp>=2.0",

    # UI
    "streamlit>=1.40",

    # Utils
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "rich>=13.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
aws = ["boto3>=1.35"]
azure = ["azure-identity>=1.18", "azure-keyvault-secrets>=4.8"]
gcp = ["google-cloud-secret-manager>=2.21"]
oci = ["oci>=2.140"]
vault = ["hvac>=2.3"]
all-secrets = [
    "boto3>=1.35",
    "azure-identity>=1.18",
    "azure-keyvault-secrets>=4.8",
    "google-cloud-secret-manager>=2.21",
    "oci>=2.140",
    "hvac>=2.3",
]

[project.scripts]
rex = "rex.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
